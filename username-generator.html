
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Username Generator - ToolBoxHub</title>

<style>
html:not(.toolbox-auth-ready) body {
  visibility: hidden;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #0b0d12;
  color: white;
  min-height: 100vh;
}

nav {
  height: 70px;
  padding: 0 7%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid #20242d;
}

.logo {
  font-size: 22px;
  font-weight: bold;
}

.logo span {
  color: #6c63ff;
}

.back {
  color: #aaa;
  text-decoration: none;
}

.back:hover {
  color: white;
}

.container {
  width: min(850px, 92%);
  margin: 50px auto;
}

h1 {
  font-size: 38px;
  margin-bottom: 10px;
}

.subtitle {
  color: #9ca3af;
  margin-bottom: 30px;
}

.box {
  background: #12151c;
  border: 1px solid #252a35;
  border-radius: 15px;
  padding: 25px;
}

label {
  display: block;
  color: #ddd;
  margin-bottom: 8px;
}

input,
select {
  width: 100%;
  padding: 14px;
  background: #0b0d12;
  color: white;
  border: 1px solid #292e39;
  border-radius: 9px;
  outline: none;
  margin-bottom: 18px;
}

input:focus,
select:focus {
  border-color: #6c63ff;
}

button {
  border: 0;
  padding: 13px 18px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 14px;
}

.generate {
  background: #6c63ff;
  color: white;
  width: 100%;
}

.results {
  margin-top: 25px;
  display: grid;
  gap: 10px;
}

.username {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  background: #181b23;
  border: 1px solid #292e39;
  padding: 15px;
  border-radius: 10px;
}

.name {
  font-family: monospace;
  font-size: 16px;
  word-break: break-all;
}

.copy {
  background: #292e39;
  color: white;
  flex-shrink: 0;
}

.message {
  color: #7ee2a8;
  min-height: 20px;
  margin-top: 15px;
}

.info {
  margin-top: 25px;
  color: #9ca3af;
  line-height: 1.6;
}

footer {
  text-align: center;
  color: #737985;
  padding: 40px 20px;
  border-top: 1px solid #20242d;
  margin-top: 50px;
}

@media (max-width: 600px) {
  nav {
    padding: 0 15px;
  }

  h1 {
    font-size: 30px;
  }

  .username {
    align-items: flex-start;
  }
}
</style>

<script type="module" src="../auth-guard.js"></script>
</head>

<body>

<nav>
  <div class="logo">
    ToolBox<span>Hub</span>
  </div>

  <a class="back" href="../index.html">← Back</a>
</nav>

<main class="container">

  <h1>Username Generator</h1>

  <p class="subtitle">
    Generate unique username ideas for gaming, social media and more.
  </p>

  <div class="box">

    <label for="keyword">Optional keyword</label>

    <input
      id="keyword"
      type="text"
      placeholder="e.g. Kyle"
      maxlength="20"
    >

    <label for="style">Username style</label>

    <select id="style">
      <option value="random">Random</option>
      <option value="gaming">Gaming</option>
      <option value="simple">Simple</option>
      <option value="cool">Cool</option>
      <option value="short">Short</option>
    </select>

    <button class="generate" onclick="generateUsernames()">
      Generate Usernames
    </button>

    <div class="results" id="results"></div>

    <div class="message" id="message" aria-live="polite"></div>

  </div>

  <div class="info">
    <strong>Tip:</strong>
    Enter a word or name to make the generated usernames more personalized.
  </div>

</main>

<footer>
  © 2026 ToolBoxHub
</footer>

<script>
const adjectives = [
  "Swift", "Shadow", "Nova", "Pixel", "Mystic",
  "Cyber", "Frost", "Neon", "Silent", "Epic",
  "Dark", "Lucky", "Rapid", "Cosmic", "Blaze",
  "Storm", "Hyper", "Ghost", "Solar", "Vortex",
  "Ultra", "Royal", "Arctic", "Turbo", "Savage",
  "Crystal", "Phantom", "Golden", "Electric", "Lunar"
];

const nouns = [
  "Wolf", "Fox", "Dragon", "Tiger", "Knight",
  "Raven", "Ninja", "Phoenix", "Hunter", "Legend",
  "Rider", "Master", "Hero", "Titan", "Spark",
  "Shadow", "Byte", "Core", "Wave", "Star",
  "Blade", "Comet", "Eagle", "Ghost", "Storm",
  "Viper", "Falcon", "Pixel", "Rocket", "Galaxy"
];

const endings = [
  "X", "Pro", "YT", "GG", "HD",
  "FX", "TV", "Dev", "One", "Zone",
  "OP", "Max", "Live", "Play", "HQ"
];

const input = document.getElementById("keyword");
const styleInput = document.getElementById("style");
const results = document.getElementById("results");
const message = document.getElementById("message");

function randomItem(array) {
  return array[Math.floor(Math.random() * array.length)];
}

function randomNumber() {
  return Math.floor(Math.random() * 9999) + 1;
}

function cleanKeyword(text) {
  return text.replace(/[^a-zA-Z0-9]/g, "").slice(0, 20);
}

function createUsername(keyword, style) {
  let username = "";

  if (style === "simple") {
    username = keyword
      ? keyword + randomNumber()
      : randomItem(adjectives) + randomNumber();
  }

  else if (style === "gaming") {
    username = keyword
      ? keyword + randomItem(endings) + randomNumber()
      : randomItem(adjectives) + randomItem(nouns) + randomNumber();
  }

  else if (style === "cool") {
    username = keyword
      ? randomItem(adjectives) + keyword + randomItem(endings)
      : randomItem(adjectives) + randomItem(nouns);
  }

  else if (style === "short") {
    username = keyword
      ? keyword.slice(0, 5) + randomNumber()
      : randomItem(adjectives).slice(0, 5) + randomNumber();
  }

  else {
    username = keyword
      ? keyword + randomItem(endings) + randomNumber()
      : randomItem(adjectives) + randomItem(nouns) + randomNumber();
  }

  return username;
}

function generateUsernames() {
  const keyword = cleanKeyword(input.value);
  const style = styleInput.value;

  results.innerHTML = "";

  const used = new Set();
  let attempts = 0;

  while (used.size < 10 && attempts < 500) {
    used.add(createUsername(keyword, style));
    attempts++;
  }

  [...used].forEach(username => {
    const row = document.createElement("div");
    row.className = "username";

    const name = document.createElement("span");
    name.className = "name";
    name.textContent = username;

    const copy = document.createElement("button");
    copy.className = "copy";
    copy.textContent = "Copy";

    copy.onclick = () => copyUsername(username);

    row.appendChild(name);
    row.appendChild(copy);
    results.appendChild(row);
  });

  message.textContent = used.size + " usernames generated.";
}

async function copyUsername(username) {
  try {
    await navigator.clipboard.writeText(username);
    message.textContent = username + " copied!";
  } catch (error) {
    const textarea = document.createElement("textarea");
    textarea.value = username;
    textarea.style.position = "fixed";
    textarea.style.opacity = "0";

    document.body.appendChild(textarea);
    textarea.select();

    try {
      const copied = document.execCommand("copy");
      message.textContent = copied
        ? username + " copied!"
        : "Copy failed. Please copy manually.";
    } catch {
      message.textContent = "Copy failed. Please copy manually.";
    }

    textarea.remove();
  }
}

generateUsernames();
</script>

</body>
</html>
