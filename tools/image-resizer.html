
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Resizer — ToolBoxHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: white;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      width: min(700px, 100%);
      margin: auto;
    }

    .back {
      display: inline-block;
      color: #9b96ff;
      text-decoration: none;
      margin-bottom: 30px;
    }

    .card {
      background: #12151c;
      border: 1px solid #252a35;
      border-radius: 18px;
      padding: 25px;
    }

    h1 { margin-bottom: 10px; }

    .description {
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .upload {
      display: block;
      border: 2px dashed #363b48;
      border-radius: 14px;
      padding: 35px 20px;
      text-align: center;
      cursor: pointer;
      transition: 0.2s;
    }

    .upload:hover { border-color: #6c63ff; }
    .upload input { display: none; }

    .upload-icon {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .upload p { color: #9ca3af; }

    .controls {
      display: none;
      margin-top: 25px;
    }

    .preview {
      text-align: center;
      margin-bottom: 25px;
    }

    #previewImage {
      max-width: 100%;
      max-height: 350px;
      border-radius: 10px;
      border: 1px solid #292e39;
    }

    .dimensions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 15px;
    }

    label {
      display: block;
      color: #b8bdc8;
      font-size: 14px;
      margin-bottom: 7px;
    }

    input[type="number"] {
      width: 100%;
      padding: 13px;
      background: #0b0d12;
      color: white;
      border: 1px solid #292e39;
      border-radius: 9px;
      outline: none;
      font-size: 15px;
    }

    input[type="number"]:focus { border-color: #6c63ff; }

    .ratio {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #9ca3af;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .ratio input { margin: 0; }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      cursor: pointer;
      font-size: 15px;
      margin-top: 10px;
    }

    .resize {
      background: #6c63ff;
      color: white;
    }

    .download {
      background: #252a35;
      color: white;
    }

    .reset {
      background: transparent;
      color: #9ca3af;
      border: 1px solid #292e39;
    }

    #result {
      display: none;
      margin-top: 25px;
      text-align: center;
    }

    #resultImage {
      max-width: 100%;
      max-height: 350px;
      border-radius: 10px;
      border: 1px solid #292e39;
    }

    .info {
      color: #9ca3af;
      margin-top: 10px;
      font-size: 14px;
    }

    @media (max-width: 500px) {
      .dimensions { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>
<div class="container">

  <a class="back" href="../index.html">
    ← Back to ToolBoxHub
  </a>

  <div class="card">
    <h1>Image Resizer</h1>

    <p class="description">
      Resize an image directly in your browser.
    </p>

    <label class="upload">
      <input
        type="file"
        id="imageInput"
        accept="image/*"
        onchange="loadImage(event)"
      >

      <div class="upload-icon">🖼️</div>
      <strong>Choose an image</strong>

      <p>
        JPG, PNG, WEBP and other common image formats
      </p>
    </label>

    <div class="controls" id="controls">
      <div class="preview">
        <img id="previewImage" alt="Image preview">
      </div>

      <div class="dimensions">
        <div>
          <label for="width">Width (px)</label>
          <input type="number" id="width" min="1">
        </div>

        <div>
          <label for="height">Height (px)</label>
          <input type="number" id="height" min="1">
        </div>
      </div>

      <label class="ratio">
        <input type="checkbox" id="keepRatio" checked>
        Keep aspect ratio
      </label>

      <button class="resize" onclick="resizeImage()">
        Resize Image
      </button>

      <button class="reset" onclick="resetTool()">
        Choose Another Image
      </button>
    </div>

    <div id="result">
      <h2>Resized Image</h2>
      <br>

      <img id="resultImage" alt="Resized image">

      <p class="info" id="resultInfo"></p>

      <button class="download" onclick="downloadImage()">
        Download Resized Image
      </button>
    </div>
  </div>
</div>

<script>
  let originalImage = new Image();
  let originalFile = null;
  let resizedData = null;

  function loadImage(event) {
    const file = event.target.files[0];

    if (!file) return;

    if (!file.type.startsWith("image/")) {
      alert("Please select a valid image.");
      event.target.value = "";
      return;
    }

    originalFile = file;
    resizedData = null;

    const reader = new FileReader();

    reader.onload = function(e) {
      originalImage.onload = function() {
        document.getElementById("previewImage").src = e.target.result;
        document.getElementById("width").value = originalImage.width;
        document.getElementById("height").value = originalImage.height;
        document.getElementById("controls").style.display = "block";
        document.getElementById("result").style.display = "none";
      };

      originalImage.onerror = function() {
        alert("Could not load this image. Try another file.");
      };

      originalImage.src = e.target.result;
    };

    reader.onerror = function() {
      alert("Could not read this image.");
    };

    reader.readAsDataURL(file);
  }

  document.getElementById("width").addEventListener("input", function() {
    if (!document.getElementById("keepRatio").checked) return;
    if (!originalImage.width || !originalImage.height) return;

    const newWidth = parseInt(this.value, 10);

    if (Number.isFinite(newWidth) && newWidth > 0) {
      document.getElementById("height").value =
        Math.round(newWidth * originalImage.height / originalImage.width);
    }
  });

  document.getElementById("height").addEventListener("input", function() {
    if (!document.getElementById("keepRatio").checked) return;
    if (!originalImage.width || !originalImage.height) return;

    const newHeight = parseInt(this.value, 10);

    if (Number.isFinite(newHeight) && newHeight > 0) {
      document.getElementById("width").value =
        Math.round(newHeight * originalImage.width / originalImage.height);
    }
  });

  function resizeImage() {
    if (!originalFile || !originalImage.width) {
      alert("Please choose an image first.");
      return;
    }

    const width = parseInt(document.getElementById("width").value, 10);
    const height = parseInt(document.getElementById("height").value, 10);

    if (
      !Number.isSafeInteger(width) ||
      !Number.isSafeInteger(height) ||
      width < 1 ||
      height < 1 ||
      width > 12000 ||
      height > 12000
    ) {
      alert("Enter valid dimensions between 1 and 12000 pixels.");
      return;
    }

    const canvas = document.createElement("canvas");
    canvas.width = width;
    canvas.height = height;

    const ctx = canvas.getContext("2d");

    if (!ctx) {
      alert("Your browser could not create the resized image.");
      return;
    }

    ctx.drawImage(originalImage, 0, 0, width, height);

    const outputType =
      ["image/png", "image/jpeg", "image/webp"].includes(originalFile.type)
        ? originalFile.type
        : "image/png";

    resizedData = canvas.toDataURL(outputType, 0.92);

    document.getElementById("resultImage").src = resizedData;

    document.getElementById("resultInfo").textContent =
      width + " × " + height + " pixels";

    document.getElementById("result").style.display = "block";
  }

  function downloadImage() {
    if (!resizedData) return;

    const link = document.createElement("a");
    link.href = resizedData;

    const extension =
      originalFile && originalFile.type === "image/jpeg" ? "jpg" :
      originalFile && originalFile.type === "image/webp" ? "webp" : "png";

    link.download = "toolboxhub-resized-image." + extension;

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function resetTool() {
    document.getElementById("imageInput").value = "";
    document.getElementById("controls").style.display = "none";
    document.getElementById("result").style.display = "none";
    document.getElementById("previewImage").src = "";
    document.getElementById("resultImage").src = "";

    resizedData = null;
    originalFile = null;
    originalImage = new Image();
  }
</script>

</body>
</html>
