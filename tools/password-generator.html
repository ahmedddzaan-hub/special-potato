<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Password Generator - ToolBoxHub</title>

<style>
html:not(.toolbox-auth-ready) body {
  visibility: hidden;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0b0d12;color:white;min-height:100vh}
nav{height:70px;padding:0 7%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #20242d}
.logo{font-size:22px;font-weight:bold}
.logo span{color:#6c63ff}
.back{color:#aaa;text-decoration:none}
.back:hover{color:white}
.container{width:min(750px,92%);margin:45px auto}
h1{font-size:36px;margin-bottom:10px}
.subtitle{color:#9ca3af;margin-bottom:25px;line-height:1.5}
.box{background:#12151c;border:1px solid #252a35;border-radius:15px;padding:24px}
label{display:block;margin-bottom:10px;color:#ddd}
input[type=number]{width:100%;padding:13px;background:#0b0d12;color:white;border:1px solid #292e39;border-radius:9px;margin-bottom:22px}
.options{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:22px}
.option{display:flex;align-items:center;gap:9px;color:#ddd}
.option input{accent-color:#6c63ff;width:17px;height:17px}
button{border:0;padding:13px 17px;border-radius:9px;cursor:pointer;font-size:14px}
.generate{background:#6c63ff;color:white;width:100%;font-weight:bold}
.password{display:flex;gap:10px;margin-top:20px}
.password input{flex:1;min-width:0;padding:14px;background:#0b0d12;color:#7ee2a8;border:1px solid #292e39;border-radius:9px;font-family:monospace;font-size:15px}
.copy{background:#292e39;color:white}
.status{margin-top:15px;color:#7ee2a8;min-height:20px}
.status.error{color:#ff9292}
.strength{margin-top:15px;color:#aaa;font-size:14px;line-height:1.5}
footer{text-align:center;color:#737985;padding:35px;border-top:1px solid #20242d;margin-top:50px}

@media(max-width:500px){
  nav{padding:0 15px}
  .options{grid-template-columns:1fr}
  h1{font-size:30px}
  .box{padding:18px}
}
</style>

<script type="module">
import { initializeToolPage } from "../tools.js";

initializeToolPage();
</script>

</head>

<body>

<nav>
  <div class="logo">ToolBox<span>Hub</span></div>
  <a class="back" href="../index.html">← Back</a>
</nav>

<main class="container">

  <h1>Password Generator</h1>

  <p class="subtitle">
    Generate random passwords with options for length, numbers and symbols.
  </p>

  <div class="box">

    <label for="length">
      Password length (8–64)
    </label>

    <input
      type="number"
      id="length"
      min="8"
      max="64"
      value="16"
    >

    <div class="options">

      <label class="option">
        <input type="checkbox" id="upper" checked>
        Uppercase letters
      </label>

      <label class="option">
        <input type="checkbox" id="lower" checked>
        Lowercase letters
      </label>

      <label class="option">
        <input type="checkbox" id="numbers" checked>
        Numbers
      </label>

      <label class="option">
        <input type="checkbox" id="symbols" checked>
        Symbols
      </label>

    </div>

    <button
      class="generate"
      onclick="generatePassword()"
    >
      Generate Password
    </button>

    <div class="password">

      <input
        id="result"
        readonly
        placeholder="Your password appears here"
      >

      <button
        class="copy"
        onclick="copyPassword()"
      >
        Copy
      </button>

    </div>

    <div
      class="strength"
      id="strength"
    ></div>

    <div
      class="status"
      id="status"
      aria-live="polite"
    ></div>

  </div>

</main>

<footer>
  © 2026 ToolBoxHub
</footer>

<script type="module">

import { runTool } from "../tools.js";

const upperChars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const lowerChars = "abcdefghijklmnopqrstuvwxyz";
const numberChars = "0123456789";
const symbolChars = "!@#$%^&*()-_=+[]{}?";


function secureRandom(max) {

  if (
    !Number.isInteger(max) ||
    max < 1 ||
    max > 4294967296
  ) {
    throw new Error("Invalid random range.");
  }

  const array = new Uint32Array(1);

  const range = 4294967296;

  const limit =
    Math.floor(range / max) * max;

  let value;

  do {

    crypto.getRandomValues(array);

    value = array[0];

  } while (value >= limit);

  return value % max;
}


function shuffle(array) {

  for (
    let i = array.length - 1;
    i > 0;
    i--
  ) {

    const j = secureRandom(i + 1);

    [array[i], array[j]] =
      [array[j], array[i]];

  }

  return array;
}


async function generatePassword() {

  const status =
    document.getElementById("status");

  const strength =
    document.getElementById("strength");

  const result =
    document.getElementById("result");

  status.textContent = "";
  status.className = "status";

  strength.textContent = "";

  await runTool(
    "password-generator",
    async () => {

      const length =
        Number(
          document.getElementById("length").value
        );

      if (
        !Number.isInteger(length) ||
        length < 8 ||
        length > 64
      ) {

        status.textContent =
          "Choose a password length between 8 and 64.";

        status.classList.add("error");

        throw new Error(
          "Choose a password length between 8 and 64."
        );

      }


      const groups = [];


      if (
        document.getElementById("upper").checked
      ) {
        groups.push(upperChars);
      }


      if (
        document.getElementById("lower").checked
      ) {
        groups.push(lowerChars);
      }


      if (
        document.getElementById("numbers").checked
      ) {
        groups.push(numberChars);
      }


      if (
        document.getElementById("symbols").checked
      ) {
        groups.push(symbolChars);
      }


      if (groups.length === 0) {

        status.textContent =
          "Select at least one character type.";

        status.classList.add("error");

        throw new Error(
          "Select at least one character type."
        );

      }


      if (length < groups.length) {

        status.textContent =
          "Increase the length to match your selected options.";

        status.classList.add("error");

        throw new Error(
          "Increase the length to match your selected options."
        );

      }


      try {

        const allCharacters =
          groups.join("");

        const password = [];


        // At least one character from every
        // selected character group.

        groups.forEach(group => {

          password.push(
            group[
              secureRandom(group.length)
            ]
          );

        });


        // Fill the remaining length.

        while (
          password.length < length
        ) {

          password.push(
            allCharacters[
              secureRandom(
                allCharacters.length
              )
            ]
          );

        }


        shuffle(password);


        result.value =
          password.join("");


        status.textContent =
          "Password generated successfully!";


        strength.textContent =
          "Generated using your browser's cryptographically secure random number generator.";

      } catch (error) {

        result.value = "";

        status.textContent =
          "Your browser could not generate a secure password.";

        status.classList.add("error");

        throw new Error(
          "Your browser could not generate a secure password."
        );

      }

    }
  );

}


async function copyPassword() {

  const result =
    document.getElementById("result");

  const status =
    document.getElementById("status");


  if (!result.value) {

    status.textContent =
      "Generate a password first.";

    status.className =
      "status error";

    return;

  }


  try {

    await navigator.clipboard.writeText(
      result.value
    );

    status.textContent =
      "Password copied!";

    status.className =
      "status";

  } catch (error) {

    result.select();

    result.setSelectionRange(
      0,
      result.value.length
    );


    try {

      const copied =
        document.execCommand("copy");


      status.textContent =
        copied
          ? "Password copied!"
          : "Copy failed. Please copy manually.";


      status.className =
        copied
          ? "status"
          : "status error";

    } catch {

      status.textContent =
        "Copy failed. Please copy manually.";

      status.className =
        "status error";

    }

  }

}


// Make functions available to the
// existing onclick buttons.

window.generatePassword =
  generatePassword;

window.copyPassword =
  copyPassword;

</script>

</body>
</html>
