
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — ToolBoxHub</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#0b0d12;
  color:white;
  min-height:100vh;
  padding:30px 20px;
}
.container{width:min(600px,100%);margin:auto}
a{color:#9b96ff;text-decoration:none}
.back{display:inline-block;margin-bottom:30px}
.card{
  background:#12151c;
  border:1px solid #252a35;
  border-radius:18px;
  padding:25px;
}
h1{margin-bottom:10px}
.description{color:#9ca3af;margin-bottom:25px}
textarea{
  width:100%;
  height:120px;
  resize:vertical;
  background:#0b0d12;
  color:white;
  border:1px solid #292e39;
  border-radius:10px;
  padding:15px;
  font-size:16px;
  outline:none;
}
textarea:focus{border-color:#6c63ff}
button{
  border:none;
  border-radius:10px;
  padding:13px 18px;
  font-size:15px;
  cursor:pointer;
  margin-top:15px;
}
button:disabled{opacity:.6;cursor:not-allowed}
.generate{background:#6c63ff;color:white;width:100%}
.clear{background:#252a35;color:white;width:100%}
#qrContainer{
  display:none;
  margin-top:25px;
  text-align:center;
  background:white;
  padding:20px;
  border-radius:12px;
}
#qrContainer img{max-width:100%;width:260px;height:260px}
.download{background:#111;color:white;width:100%;margin-top:15px}
.error{color:#ff7777;margin-top:15px;display:none}
.status{
  margin-top:18px;
  padding:13px;
  background:#0b0d12;
  border:1px solid #292e39;
  border-radius:10px;
  color:#c4c7d0;
  font-size:14px;
}
.wallet{
  margin-top:15px;
  color:#c4bfff;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="container">
<a class="back" href="../index.html">← Back to ToolBoxHub</a>

<div class="card">
<h1>QR Code Generator</h1>
<p class="description">Create a QR code from any text, link, or message.</p>

<textarea id="text" placeholder="Enter a URL or text..."></textarea>

<p id="error" class="error">Please enter something first.</p>

<button id="generateButton" class="generate" onclick="generateQR()">
Generate QR Code
</button>

<div id="qrContainer">
<img id="qrImage" alt="Generated QR Code">
<button class="download" onclick="downloadQR()">Download QR Code</button>
</div>

<div id="status" class="status">Sign in and generate a QR code to earn coins.</div>
<div id="wallet" class="wallet">Wallet: Loading...</div>

<button class="clear" onclick="clearQR()">Clear</button>
</div>
</div>

<script type="module">
import {
  getToolboxUser,
  getToolboxBalance,
  claimToolReward
} from "../toolbox-api.js";

const textInput = document.getElementById("text");
const error = document.getElementById("error");
const container = document.getElementById("qrContainer");
const image = document.getElementById("qrImage");
const statusBox = document.getElementById("status");
const walletBox = document.getElementById("wallet");
const generateButton = document.getElementById("generateButton");

let currentUser = null;
let generationNumber = 0;
let rewardRequestRunning = false;

function setStatus(message) {
  statusBox.textContent = message;
}

async function refreshWallet() {
  try {
    currentUser = await getToolboxUser();
    const balance = await getToolboxBalance(currentUser);
    walletBox.textContent = "Wallet: " + (balance.coins ?? 0) + " coins";
  } catch (err) {
    walletBox.textContent = "Wallet unavailable";
    console.error("Wallet error:", err);
  }
}

async function rewardAfterSuccessfulGeneration() {
  if (rewardRequestRunning) return;

  rewardRequestRunning = true;
  setStatus("QR generated! Checking your coin reward...");

  try {
    currentUser = await getToolboxUser();

    const result = await claimToolReward(currentUser, "qr");

    if (result?.success) {
      setStatus(
        "Success! You earned " + result.reward + " coins!"
      );
    } else {
      setStatus("QR generated, but the reward was not confirmed.");
    }

    await refreshWallet();

  } catch (err) {
    const message = err.message || "Reward request failed.";

    if (message.toLowerCase().includes("already claimed")) {
      setStatus("QR generated! You've already claimed today's QR reward.");
    } else {
      setStatus("QR generated, but reward failed: " + message);
    }

    await refreshWallet();

  } finally {
    rewardRequestRunning = false;
  }
}

window.generateQR = function() {
  const value = textInput.value.trim();

  if (!value) {
    error.style.display = "block";
    container.style.display = "none";
    return;
  }

  error.style.display = "none";
  container.style.display = "block";
  setStatus("Generating your QR code...");

  const thisGeneration = ++generationNumber;

  image.onload = async function() {
    if (thisGeneration !== generationNumber) return;
    await rewardAfterSuccessfulGeneration();
  };

  image.onerror = function() {
    if (thisGeneration !== generationNumber) return;
    container.style.display = "none";
    setStatus("QR generation failed. Please try again.");
  };

  image.src =
    "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=" +
    encodeURIComponent(value);
};

window.downloadQR = function() {
  if (!image.src) return;

  const link = document.createElement("a");
  link.href = image.src;
  link.download = "toolboxhub-qr.png";
  document.body.appendChild(link);
  link.click();
  link.remove();
};

window.clearQR = function() {
  generationNumber++;
  textInput.value = "";
  image.src = "";
  container.style.display = "none";
  error.style.display = "none";
  setStatus("Ready to generate another QR code.");
};

refreshWallet();
</script>
</body>
</html>
