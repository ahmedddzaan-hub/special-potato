
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Code Generator — ToolBoxHub</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0d12;
      color: white;
      min-height: 100vh;
      padding: 30px 20px;
    }

    .container {
      width: min(600px, 100%);
      margin: auto;
    }

    a {
      color: #9b96ff;
      text-decoration: none;
    }

    .back {
      display: inline-block;
      margin-bottom: 30px;
    }

    .card {
      background: #12151c;
      border: 1px solid #252a35;
      border-radius: 18px;
      padding: 25px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .description {
      color: #9ca3af;
      margin-bottom: 25px;
    }

    textarea {
      width: 100%;
      height: 120px;
      resize: vertical;
      background: #0b0d12;
      color: white;
      border: 1px solid #292e39;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      outline: none;
    }

    textarea:focus {
      border-color: #6c63ff;
    }

    button {
      border: none;
      border-radius: 10px;
      padding: 13px 18px;
      font-size: 15px;
      cursor: pointer;
      margin-top: 15px;
    }

    .generate {
      background: #6c63ff;
      color: white;
      width: 100%;
    }

    .clear {
      background: #252a35;
      color: white;
      width: 100%;
    }

    #qrContainer {
      display: none;
      margin-top: 25px;
      text-align: center;
      background: white;
      padding: 20px;
      border-radius: 12px;
    }

    #qrContainer img {
      max-width: 100%;
      width: 260px;
      height: 260px;
    }

    .download {
      background: #111;
      color: white;
      width: 100%;
      margin-top: 15px;
    }

    .error {
      color: #ff7777;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <a class="back" href="../index.html">← Back to ToolBoxHub</a>

  <div class="card">

    <h1>QR Code Generator</h1>

    <p class="description">
      Create a QR code from any text, link, or message.
    </p>

    <textarea
      id="text"
      placeholder="Enter a URL or text..."
    ></textarea>

    <p id="error" class="error">
      Please enter something first.
    </p>

    <button class="generate" onclick="generateQR()">
      Generate QR Code
    </button>

    <div id="qrContainer">
      <img id="qrImage" alt="Generated QR Code">

      <button class="download" onclick="downloadQR()">
        Download QR Code
      </button>
    </div>

    <button class="clear" onclick="clearQR()">
      Clear
    </button>

  </div>

</div>

<script>
  function generateQR() {
    const text = document.getElementById("text").value.trim();
    const error = document.getElementById("error");
    const container = document.getElementById("qrContainer");
    const image = document.getElementById("qrImage");

    if (!text) {
      error.style.display = "block";
      container.style.display = "none";
      return;
    }

    error.style.display = "none";

    const encoded = encodeURIComponent(text);

    image.src =
      "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=" +
      encoded;

    container.style.display = "block";
  }

  function downloadQR() {
    const image = document.getElementById("qrImage");
    const link = document.createElement("a");

    link.href = image.src;
    link.download = "toolboxhub-qr.png";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function clearQR() {
    document.getElementById("text").value = "";
    document.getElementById("qrContainer").style.display = "none";
    document.getElementById("error").style.display = "none";
  }
</script>

</body>
</html>
