<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code Generator — ToolBoxHub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#0b0d12;
  color:#fff;
  min-height:100vh;
  padding:30px 20px;
}

.container{
  width:min(600px,100%);
  margin:auto;
}

.back{
  display:inline-block;
  margin-bottom:25px;
  color:#9b96ff;
  text-decoration:none;
}

.card{
  background:#12151c;
  border:1px solid #252a35;
  border-radius:18px;
  padding:25px;
}

h1{
  margin-bottom:10px;
}

.description{
  color:#9ca3af;
  margin-bottom:25px;
}

textarea{
  width:100%;
  min-height:120px;
  resize:vertical;
  background:#0b0d12;
  color:#fff;
  border:1px solid #292e39;
  border-radius:10px;
  padding:15px;
  font-size:16px;
  outline:none;
}

textarea:focus{
  border-color:#6c63ff;
}

button{
  border:0;
  border-radius:10px;
  padding:13px 18px;
  font-size:15px;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.generate{
  width:100%;
  margin-top:15px;
  background:#6c63ff;
  color:#fff;
}

.clear{
  width:100%;
  margin-top:15px;
  background:#252a35;
  color:#fff;
}

#qrContainer{
  display:none;
  margin-top:25px;
  text-align:center;
  background:#fff;
  padding:20px;
  border-radius:12px;
}

#qrImage{
  width:260px;
  max-width:100%;
  height:260px;
}

.download{
  width:100%;
  margin-top:15px;
  background:#111;
  color:#fff;
}

#error{
  display:none;
  margin-top:10px;
  color:#ff7777;
}

#wallet{
  margin-top:15px;
  color:#c4bfff;
  font-weight:bold;
}

#toolMessage{
  margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<a class="back" href="../index.html">
← Back to ToolBoxHub
</a>

<div class="card">

<h1>QR Code Generator</h1>

<p class="description">
Create a QR code from any text, link, or message.
</p>

<textarea
  id="qrText"
  placeholder="Enter a URL or text..."
></textarea>

<div id="error">
Please enter something first.
</div>

<button
  id="generateButton"
  class="generate"
>
Generate QR Code
</button>

<div id="qrContainer">

<img
  id="qrImage"
  alt="Generated QR Code"
>

<button
  id="downloadButton"
  class="download"
>
Download QR Code
</button>

</div>

<div id="wallet">
Wallet: Loading...
</div>

<button
  id="clearButton"
  class="clear"
>
Clear
</button>

</div>
</div>

<script type="module">

import {
  initializeToolPage,
  refreshWallet,
  runTool
} from "../tools.js";


const text =
  document.getElementById("qrText");

const error =
  document.getElementById("error");

const generateButton =
  document.getElementById("generateButton");

const qrContainer =
  document.getElementById("qrContainer");

const qrImage =
  document.getElementById("qrImage");

const downloadButton =
  document.getElementById("downloadButton");

const clearButton =
  document.getElementById("clearButton");

const wallet =
  document.getElementById("wallet");


/*
  Load login + wallet when the page opens.
*/

const loggedIn =
  await initializeToolPage();


if (loggedIn) {

  const coins =
    await refreshWallet();

  if (coins !== null) {
    wallet.textContent =
      `Wallet: ${coins} coins`;
  }

}


/*
  Generate QR
*/

generateButton.addEventListener(
  "click",
  async () => {

    const value =
      text.value.trim();

    if (!value) {

      error.style.display =
        "block";

      return;

    }

    error.style.display =
      "none";

    generateButton.disabled =
      true;

    qrContainer.style.display =
      "block";


    /*
      The shared runTool() handles the
      reward AFTER the QR actually loads.
    */

    await runTool(
      "qr",
      async () => {

        await new Promise(
          (resolve, reject) => {

            qrImage.onload =
              () => resolve();

            qrImage.onerror =
              () => reject(
                new Error(
                  "QR code could not be generated."
                )
              );

            qrImage.src =
              "https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=" +
              encodeURIComponent(value);

          }
        );

      }
    );


    generateButton.disabled =
      false;


    const coins =
      await refreshWallet();

    if (coins !== null) {

      wallet.textContent =
        `Wallet: ${coins} coins`;

    }

  }
);


/*
  Download
*/

downloadButton.addEventListener(
  "click",
  () => {

    if (!qrImage.src) {
      return;
    }

    const link =
      document.createElement("a");

    link.href =
      qrImage.src;

    link.download =
      "toolboxhub-qr.png";

    document.body.appendChild(link);

    link.click();

    link.remove();

  }
);


/*
  Clear
*/

clearButton.addEventListener(
  "click",
  () => {

    text.value = "";

    qrImage.src = "";

    qrContainer.style.display =
      "none";

    error.style.display =
      "none";

  }
);

</script>

</body>
</html>
